<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>To-Do App</title>

<style>
:root {
    --bg: linear-gradient(135deg, #667eea, #764ba2);
    --card: white;
    --text: #333;
}

.dark {
    --bg: #121212;
    --card: #1e1e1e;
    --text: #fff;
}

body {
    margin: 0;
    font-family: Arial;
    background: var(--bg);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    transition: 0.3s;
}

.container {
    background: var(--card);
    color: var(--text);
    padding: 25px;
    border-radius: 15px;
    width: 360px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    text-align: center;
    transition: 0.3s;
}

input {
    padding: 10px;
    width: 65%;
}

button {
    padding: 8px;
    cursor: pointer;
}

ul {
    list-style: none;
    padding: 0;
}

li {
    background: rgba(0,0,0,0.05);
    margin: 10px 0;
    padding: 10px;
    border-radius: 8px;
    display: flex;
    justify-content: space-between;
    animation: aparecer 0.3s ease;
}

.concluida {
    text-decoration: line-through;
    opacity: 0.6;
}

.filtros button {
    margin: 5px;
}

.topo {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.toggle {
    cursor: pointer;
}

@keyframes aparecer {
    from {opacity: 0; transform: translateY(10px);}
    to {opacity: 1; transform: translateY(0);}
}
</style>
</head>

<body>

<div class="container">
    <div class="topo">
        <h2>To-Do App 📝</h2>
        <span class="toggle" onclick="alternarTema()">🌙</span>
    </div>

    <input id="tarefa" placeholder="Nova tarefa">
    <button onclick="adicionar()">+</button>

    <div class="filtros">
        <button onclick="filtrar('todas')">Todas</button>
        <button onclick="filtrar('pendentes')">Pendentes</button>
        <button onclick="filtrar('concluidas')">Concluídas</button>
    </div>

    <ul id="lista"></ul>

    <p id="contador"></p>
</div>

<script>
let filtroAtual = "todas";

function alternarTema() {
    document.body.classList.toggle("dark");
}

function adicionar() {
    let input = document.getElementById("tarefa");
    let texto = input.value;

    if (texto === "") return;

    let tarefas = JSON.parse(localStorage.getItem("tarefas")) || [];
    tarefas.push({ texto, concluida: false });

    localStorage.setItem("tarefas", JSON.stringify(tarefas));

    input.value = "";
    mostrar();
}

function mostrar() {
    let lista = document.getElementById("lista");
    let contador = document.getElementById("contador");

    lista.innerHTML = "";

    let tarefas = JSON.parse(localStorage.getItem("tarefas")) || [];

    let filtradas = tarefas.filter(t => {
        if (filtroAtual === "pendentes") return !t.concluida;
        if (filtroAtual === "concluidas") return t.concluida;
        return true;
    });

    filtradas.forEach((tarefa, index) => {
        let item = document.createElement("li");

        if (tarefa.concluida) item.classList.add("concluida");

        let texto = document.createElement("span");
        texto.innerText = tarefa.texto;

        texto.onclick = () => {
            tarefas[index].concluida = !tarefas[index].concluida;
            salvar(tarefas);
        };

        texto.ondblclick = () => {
            let novo = prompt("Editar tarefa:", tarefa.texto);
            if (novo) {
                tarefas[index].texto = novo;
                salvar(tarefas);
            }
        };

        let del = document.createElement("button");
        del.innerText = "❌";

        del.onclick = (e) => {
            e.stopPropagation();
            tarefas.splice(index, 1);
            salvar(tarefas);
        };

        item.appendChild(texto);
        item.appendChild(del);
        lista.appendChild(item);
    });

    let total = tarefas.length;
    let concluidas = tarefas.filter(t => t.concluida).length;

    contador.innerText = `${concluidas} concluídas de ${total} tarefas`;
}

function filtrar(tipo) {
    filtroAtual = tipo;
    mostrar();
}

function salvar(tarefas) {
    localStorage.setItem("tarefas", JSON.stringify(tarefas));
    mostrar();
}

mostrar();
</script>

</body>
</html>
