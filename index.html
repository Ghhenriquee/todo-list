<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>To-Do List</title>

    <style>
        body {
            font-family: Arial;
            background: #121212;
            color: white;
            text-align: center;
            padding-top: 50px;
        }

        input {
            padding: 10px;
            width: 200px;
        }

        button {
            padding: 10px;
            margin-left: 5px;
            cursor: pointer;
        }

        ul {
            list-style: none;
            padding: 0;
            margin-top: 20px;
        }

        li {
            margin: 10px;
            background: #1e1e1e;
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <h1>Minha To-Do List 📝</h1>

    <input id="tarefa" placeholder="Digite uma tarefa">
    <button onclick="adicionar()">Adicionar</button>

    <ul id="lista"></ul>

    <script>
        function adicionar() {
            let input = document.getElementById("tarefa");
            let texto = input.value;

            if (texto === "") {
                alert("Digite uma tarefa!");
                return;
            }

            let lista = document.getElementById("lista");

            let item = document.createElement("li");
            item.innerText = texto;

            item.onclick = function() {
                item.style.textDecoration = "line-through";
            }

            lista.appendChild(item);

            input.value = "";
        }
    </script>

</body>
</html>
